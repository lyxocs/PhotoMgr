<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选片审核</title>
<style>
:root{color-scheme:dark;--base:#191b17;--panel:#242720;--edge:#3a3f33;--ink:#f0f0e8;--muted:#b9bfad;--accent:#dbec98}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font:15px/1.55 "Microsoft YaHei UI","Segoe UI",sans-serif}
button,select,input[type=text],input[type=password]{font:inherit;border:1px solid var(--edge);border-radius:7px;background:var(--panel);color:var(--ink);padding:8px 12px}
button,select,input[type=checkbox],summary{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#232916;font-weight:700}
button:disabled{opacity:.5;cursor:wait}
main,header>div{max-width:1380px;margin:auto;padding:0 30px}
header{position:sticky;top:0;z-index:2;background:#1b1d18;border-bottom:1px solid var(--edge)}
header>div{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding-top:13px;padding-bottom:13px}
h1{font-size:23px;letter-spacing:.02em;margin:0}
h2{font-size:18px;margin:0}
p{margin:0}
small,.muted{color:var(--muted)}
.toolbar,.filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.filters{margin:22px 0 12px}
#status{min-height:30px;white-space:pre-wrap;overflow-wrap:anywhere}
section{margin:0 0 27px}
.group-head{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--edge);padding:13px 0}
.capture-day{margin-bottom:36px}
.capture-day .similar-group{margin-left:clamp(8px,2vw,24px)}
.similar-group h3{margin:0;font-size:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:13px}
article{min-width:0;border:1px solid var(--edge);border-radius:9px;overflow:hidden;background:var(--panel)}
article[data-selected=true]{border-color:#a6bb67}
.image{background:#141511;display:block;padding:0;width:100%;border:0;border-radius:0}
.image img{width:100%;height:245px;display:block;object-fit:contain}
.meta{padding:12px}
.meta-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta-top label{display:flex;gap:6px;align-items:center}
input{accent-color:var(--accent)}
.total{color:var(--accent);font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.tag{font-size:13px;color:var(--accent);margin:4px 0}
.details{margin-top:8px;color:var(--muted);font-size:13px}
dl{margin:6px 0 0}
dl div{display:flex;justify-content:space-between;gap:8px}
dd{margin:0;color:var(--ink)}
dialog{border:1px solid var(--edge);border-radius:10px;background:#181a16;color:var(--ink);max-width:96vw;max-height:96vh;padding:10px}
dialog::backdrop{background:#000b}
#viewer[open]{box-sizing:border-box;width:98vw;height:96dvh;max-width:none;max-height:none;display:flex;flex-direction:column;gap:6px}
.viewer-stage{flex:1;min-height:0;overflow:auto;background:#11120f;overscroll-behavior:contain;touch-action:none}
.viewer-canvas{display:grid;place-items:center;width:max-content;height:max-content;min-width:100%;min-height:100%}
.viewer-stage img{display:block;max-width:none;user-select:none;cursor:zoom-in}
.viewer-stage[data-zoomed] img{cursor:grab}
.viewer-stage[data-dragging] img{cursor:grabbing}
#viewerStatus{margin:0;color:var(--muted)}
#viewerStatus:empty{display:none}
#source,#job{overflow-wrap:anywhere}
#batch{max-width:min(65vw,420px)}
#importDialog{width:min(580px,95vw)}
#importDialog form{display:grid;gap:12px;padding:8px}
#importDialog input{width:100%}
#folders{display:grid;gap:5px;max-height:35vh;overflow:auto}
#folders button{text-align:left;overflow-wrap:anywhere}
#jobProgress{width:min(100%,360px);accent-color:var(--accent)}
.dialog-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:8px}
@media(max-width:600px){main,header>div{padding-left:14px;padding-right:14px}.image img{height:260px}}
</style>
</head>
<body>
<header><div>
<div><h1>选片审核</h1><small id="counts">读取照片中…</small></div>
<div class="toolbar">
<button id="save">保存审核</button>
<button id="original">导出原始 JPG</button>
<button id="adjusted" class="primary">自动调色并导出</button>
</div>
</div></header>
<main>
<div class="filters">
<label>照片批次 <select id="batch"></select></label>
<button id="newBatch" class="primary">新建批次</button>
<button id="resume" hidden>续跑当前批次</button>
<button id="rescore" hidden>按新分组重评</button>
<button id="refineGroups" hidden>hy4 优化分组</button>
</div>
<p id="source" class="muted"></p>
<p id="job" role="status"></p>
<progress id="jobProgress" hidden></progress>
<div class="filters">
<label>显示 <select id="filter"><option value="all">全部照片</option><option value="ranking">高分榜</option><option value="selected">已勾选</option><option value="maybe">AI 候选</option><option value="duplicate">有重复副本</option><option value="pending">待评分</option><option value="blurred">已标记模糊</option></select></label>
<label id="groupOptions">分组 <select id="groupBy"><option value="date">拍摄日期 → 相似照片</option><option value="similar">仅相似照片</option></select></label>
<label id="rankOptions" hidden>榜单范围 <select id="rankLimit"><option value="30">前 30 张</option><option value="100">前 100 张</option><option value="all">全部已评分</option></select></label>
<button id="refresh">刷新评分</button>
</div>
<p id="status" class="muted" role="status" aria-live="polite"></p>
<div id="groups"></div>
</main>
<dialog id="viewer">
  <div class="dialog-bar"><span id="viewerName"></span><button id="close">关闭</button></div>
  <div class="toolbar" aria-label="照片查看工具">
    <button id="prevPhoto" title="上一张（←）" aria-label="同组上一张">←</button>
    <span id="viewerPosition"></span>
    <button id="nextPhoto" title="下一张（→）" aria-label="同组下一张">→</button>
    <button id="compareGrade" aria-keyshortcuts="C">看调色版 (C)</button>
    <button id="showMasks" aria-pressed="false">蒙版</button>
    <button id="gradeAdvice">使用 hy4 建议</button>
    <button id="zoomOut" aria-label="缩小">−</button>
    <button id="zoomReset" aria-label="恢复适屏">适屏</button>
    <button id="zoomIn" aria-label="放大">+</button>
  </div>
  <div id="viewerStage" class="viewer-stage" tabindex="0" aria-label="滚轮或加减键缩放，拖动查看，按 0 适屏">
    <div class="viewer-canvas"><img id="viewerImage" alt="" draggable="false"></div>
  </div>
  <div id="viewerStatus" role="status"></div>
  <form id="gradeKeyForm" hidden>
    <label>TokenLink API Key <input type="password" id="gradeKey" autocomplete="off" placeholder="已配置环境变量时可留空"></label>
    <button type="submit">发送当前照片缩略图并获取建议</button>
  </form>
</dialog>
<dialog id="importDialog">
<form id="importForm">
<h2 id="importTitle">新建批次</h2>
<div id="folderPicker">
<label>照片文件夹 <input type="text" id="folderPath" placeholder="粘贴完整路径，或从磁盘浏览"></label>
<div class="toolbar"><button id="browse" type="button">浏览文件夹</button><button id="up" type="button" hidden>上一级</button></div>
<div id="folders" aria-label="子文件夹"></div>
<small>会扫描所选文件夹及其子文件夹中的所有 JPG/JPEG。</small>
</div>
<label>TokenLink API Key <input type="password" id="apiKey" autocomplete="off" placeholder="已配置环境变量时可留空"></label>
<small>hy4 会收到用于评分的照片缩略图。</small>
<p id="importError" role="status"></p>
<div class="toolbar"><button id="start" class="primary">开始去重、分组和评分</button><button id="cancelImport" type="button">取消</button></div>
</form>
</dialog>
<script>
const byId = id => document.getElementById(id);
const names = {composition:"构图与视觉平衡",light:"光线与色彩",moment:"主体与瞬间",technical:"技术质量",impact:"独特性与感染力"};
const decisions = {pick:"AI 推荐",maybe:"AI 候选",skip:"AI 不推荐"};
let project;
let token;
let activeBatch;
let resumeBatch;
let rescoreBatch = false;
let refineBatch = false;
let folderParent = "";
let refreshVersion = 0;
const phases = {queued:"等待处理",scanning:"正在扫描和去重",grouping:"正在分组",refining:"hy4 正在复核分组",scoring:"hy4 正在评分",
                complete:"处理完成",error:"处理未完成",interrupted:"处理已中断，可续跑"};
const running = new Set(["queued","scanning","grouping","refining","scoring"]);
let changed = {};
let dirty = false;
let viewerPhoto;
let viewerBatch;
let viewerGroup = [];
let viewerView = "original";
let compareView = "original";
let viewerRequest = 0;
let imageUrl = "";
let zoom = 1;
let drag;
let refreshTimer;
const status = message => { byId("status").textContent = message; };
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function allPhotos() { return project.groups.flatMap(group => group.photos); }
const photoNameOrder = new Intl.Collator("zh-CN", {numeric:true, sensitivity:"base"});
function byCapture(left, right) {
  return (left.captured || "9999").localeCompare(right.captured || "9999") ||
    photoNameOrder.compare(left.name, right.name) || left.id.localeCompare(right.id);
}
function captureGroups(groups, mergedIds) {
  const days = new Map();
  for (const group of groups) {
    for (const photo of group.photos) {
      const day = photo.captured?.slice(0, 10) || "";
      const groupId = mergedIds?.[photo.id] ?? group.id;
      if (!days.has(day)) days.set(day, new Map());
      const groupsOnDay = days.get(day);
      if (!groupsOnDay.has(groupId)) groupsOnDay.set(groupId, []);
      groupsOnDay.get(groupId).push(photo);
    }
  }
  return Array.from(days, ([day, groupsOnDay]) => ({
    day,
    groups: Array.from(groupsOnDay, ([id, photos]) => ({id, photos: photos.sort(byCapture)}))
      .sort((left, right) => byCapture(left.photos[0], right.photos[0]))
  })).sort((left, right) => (left.day || "9999").localeCompare(right.day || "9999"));
}
function counts(groupCount = byId("groupBy").value === "date"
  ? captureGroups(project.groups, project.review_group_ids).reduce((total, day) => total + day.groups.length, 0)
  : project.groups.length) {
  const photos = allPhotos();
  byId("counts").textContent = project.input_count + " 个文件 · " + photos.length + " 张去重后照片 · " +
    groupCount + " 组 · " + photos.filter(photo => photo.rating).length + " 张已评分 · " +
    photos.filter(photo => photo.selected).length + " 张已勾选";
}
function show(photo, rank = null, groupPhotos = null) {
  const src = "/preview/" + photo.id + ".jpg";
  const card = element("article");
  card.dataset.selected = photo.selected;
  const preview = element("button", undefined, "image");
  preview.type = "button";
  preview.setAttribute("aria-label", "放大 " + photo.name);
  const img = element("img");
  img.src = src;
  img.alt = photo.name;
  img.loading = "lazy";
  preview.append(img);
  preview.onclick = () => {
    viewerBatch = activeBatch;
    viewerGroup = groupPhotos || project.groups.find(group => group.photos.some(item => item.id === photo.id))?.photos || [photo];
    byId("viewer").showModal();
    openViewerPhoto(photo);
    byId("viewerStage").focus();
  };
  const meta = element("div", undefined, "meta");
  const row = element("div", undefined, "meta-top");
  const label = element("label");
  const box = element("input");
  box.type = "checkbox";
  box.checked = photo.selected;
  box.disabled = photo.blurred;
  box.onchange = () => {
    photo.selected = box.checked;
    changed[photo.id] = box.checked;
    dirty = true;
    card.dataset.selected = box.checked;
    counts();
    if (byId("filter").value === "selected" && !box.checked) render();
  };
  label.append(box, document.createTextNode(photo.name));
  row.append(label);
  if (photo.rating) row.append(element("span", photo.rating.total.toFixed(rank ? 2 : 1), "total"));
  meta.append(row);
  if (photo.captured) meta.append(element("p", photo.captured.replace("T", " "), "muted"));
  if (rank) meta.append(element("p", "第 " + rank.position + " 名 · 第 " + rank.groupId + " 组", "muted"));
  const rating = photo.rating;
  if (rating) {
    const decision = photo.blurred ? "人工标记模糊" :
      rating.technical_issue ? "有技术缺陷 · 请复核" : decisions[rating.decision];
    meta.append(element("p", decision, "tag"),
                element("p", rating.reason));
    const details = element("details", undefined, "details");
    details.append(element("summary", "查看五项评分"));
    const list = element("dl");
    for (const [key, weight] of Object.entries(project.weights)) {
      const line = element("div");
      line.append(element("dt", names[key] + " · " + weight + "%"), element("dd", rating.scores[key] + " / 10"));
      list.append(line);
    }
    details.append(list);
    meta.append(details);
  } else meta.append(element("p", photo.filtered ? "模型未评分 · 请人工审核" : "待 hy4 评分", "muted"));
  const blurButton = element("button", photo.blurred ? "撤销模糊标记" : "标记模糊", "details");
  blurButton.type = "button";
  blurButton.onclick = () => act(blurButton, async () => {
    const id = activeBatch;
    await post("/api/blur", {photo: photo.id, blurred: !photo.blurred}, id);
    if (id !== activeBatch) return;
    await refresh();
    status(photo.blurred ? "已撤销模糊标记。" : "已标记模糊，并从高分榜和导出勾选中移除。");
  });
  meta.append(blurButton);
  if (photo.duplicates.length) meta.append(element("p", "重复副本：" + photo.duplicates.join("、"), "details"));
  card.append(preview, meta);
  return card;
}
function renderRanking(root, groups) {
  const ranked = groups.flatMap(group => group.photos
    .filter(photo => Number.isFinite(photo.rating?.total) && !photo.blurred &&
      !photo.rating.technical_issue && photo.rating.expression !== "closed_eyes")
    .map(photo => ({photo, group})));
  ranked.sort((a, b) => b.photo.rating.total - a.photo.rating.total);
  if (!ranked.length) {
    root.append(element("p", "当前批次还没有已评分的照片。", "muted"));
    return;
  }

  const limit = byId("rankLimit").value;
  const visible = limit === "all" ? ranked : ranked.slice(0, Number(limit));
  const head = element("div", undefined, "group-head");
  head.append(element("h2", "综合分排行榜"),
              element("small", "显示 " + visible.length + " / " + ranked.length + " 张"));
  const cards = element("div", undefined, "cards");
  let position = 1;
  for (const [index, entry] of visible.entries()) {
    if (index > 0 && entry.photo.rating.total !== visible[index - 1].photo.rating.total) {
      position = index + 1;
    }
    cards.append(show(entry.photo, {position, groupId: entry.group.number}, entry.group.photos));
  }
  root.append(head, cards);
}
function render() {
  const byDate = byId("groupBy").value === "date";
  const days = byDate ? captureGroups(project.groups, project.review_group_ids) : [{groups: project.groups}];
  let number = 0;
  for (const day of days) {
    day.groups = day.groups.map(group => ({...group, number: ++number}));
  }
  counts(number);
  const root = byId("groups");
  root.replaceChildren();
  const filter = byId("filter").value;
  byId("rankOptions").hidden = filter !== "ranking";
  byId("groupOptions").hidden = filter === "ranking";
  if (filter === "ranking") {
    renderRanking(root, days.flatMap(day => day.groups));
    return;
  }
  const match = {
    all: () => true, selected: photo => photo.selected, maybe: photo => photo.rating?.decision === "maybe",
    duplicate: photo => photo.duplicates.length, pending: photo => !photo.rating,
    blurred: photo => photo.blurred
  }[filter];
  if (byDate) {
    for (const {day, groups} of days) {
      const children = groups.map(group => renderPhotoGroup(group, match, true)).filter(Boolean);
      if (!children.length) continue;
      const section = element("section", undefined, "capture-day");
      section.append(element("h2", day || "拍摄时间未知"), ...children);
      root.append(section);
    }
  } else {
    for (const group of days[0].groups) {
      const section = renderPhotoGroup(group, match, false);
      if (section) root.append(section);
    }
  }
  if (!root.children.length) root.append(element("p", "没有符合当前筛选条件的照片。", "muted"));
}
function renderPhotoGroup(group, match, nested) {
  const photos = group.photos.filter(match);
  if (!photos.length) return null;
  const section = element("section", undefined, "similar-group");
  const head = element("div", undefined, "group-head");
  head.append(element(nested ? "h3" : "h2", "第 " + group.number + " 组"), element("small", photos.length + " 张"));
  const cards = element("div", undefined, "cards");
  cards.append(...photos.map(photo => show(photo, null, group.photos)));
  section.append(head, cards);
  return section;
}
function showProgress(updated) {
  const progress = updated.progress;
  const {phase, done, total, message} = progress;
  byId("job").textContent = [phases[phase], total && phase !== "grouping" ? done + " / " + total : "", message]
    .filter(Boolean).join(" · ");
  const meter = byId("jobProgress");
  meter.hidden = !running.has(phase);
  if (total && phase !== "grouping") {
    meter.max = total;
    meter.value = done;
  } else meter.removeAttribute("value");
  byId("resume").hidden = !["error", "interrupted"].includes(phase);
  byId("rescore").hidden = running.has(phase) || !updated.groups.length;
  byId("refineGroups").hidden = running.has(phase) || !updated.groups.length;
}
async function refresh(quiet = false) {
  clearTimeout(refreshTimer);
  const version = ++refreshVersion;
  const id = activeBatch;
  if (!id) return;
  try {
    const response = await fetch("/api/project?batch=" + encodeURIComponent(id));
    const updated = await response.json();
    if (version !== refreshVersion) return;
    if (!response.ok) throw Error(updated.error);
    showProgress(updated);
    const active = running.has(updated.progress.phase);
    const photoState = state => JSON.stringify(state.groups.map(group =>
      group.photos.map(photo => [photo.id, state.review_group_ids?.[photo.id] ?? group.id,
        photo.captured, photo.rating, !!photo.filtered, !!photo.blurred])));
    const redraw = !project || photoState(project) !== photoState(updated);
    const interacting = byId("viewer").open || byId("groups").contains(document.activeElement);
    if (active || (quiet && redraw && interacting)) refreshTimer = setTimeout(() => refresh(true), 2500);
    if (quiet && (!redraw || interacting)) return;
    project = updated;
    for (const photo of allPhotos()) {
      if (!photo.blurred && Object.hasOwn(changed, photo.id)) photo.selected = changed[photo.id];
    }
    byId("source").textContent = updated.source || updated.progress.source || "";
    render();
    if (!quiet) status(updated.errors.length ? updated.errors.length + " 个文件读取失败。" : "");
  } catch (error) {
    if (version !== refreshVersion) return;
    if (quiet) refreshTimer = setTimeout(() => refresh(true), 5000);
    else status(error.message);
  }
}
async function post(path, payload, batch = activeBatch) {
  const url = path + (batch ? "?batch=" + encodeURIComponent(batch) : "");
  const response = await fetch(url, {method:"POST",headers:{"Content-Type":"application/json","X-Review-Token":token},
                                    body:JSON.stringify(payload)});
  const result = await response.json();
  if (!response.ok) throw Error(result.error);
  return result;
}
async function loadBatches() {
  const response = await fetch("/api/batches");
  if (!response.ok) throw Error("读取批次失败");
  const data = await response.json();
  token = data.token;
  const options = data.batches.map(item => {
    const option = element("option", item.source.split(/[\\/]/).filter(Boolean).at(-1) || item.source);
    option.title = item.source;
    option.value = item.id;
    return option;
  });
  byId("batch").replaceChildren(...options);
  return data.batches;
}
async function switchBatch(id) {
  if (dirty && activeBatch) await post("/api/review", {choices:changed}, activeBatch);
  activeBatch = id;
  project = undefined;
  changed = {};
  dirty = false;
  byId("batch").value = id;
  byId("source").textContent = "";
  byId("job").textContent = "";
  byId("jobProgress").hidden = true;
  byId("resume").hidden = true;
  byId("refineGroups").hidden = true;
  localStorage.setItem("photo-review-batch", id);
  byId("groups").replaceChildren();
  await refresh();
}
let folderVersion = 0;
async function browse(path) {
  const version = ++folderVersion;
  const result = await post("/api/folder", {path});
  if (version !== folderVersion) return;
  folderParent = result.parent;
  byId("folderPath").value = result.path;
  byId("up").hidden = !result.path;
  byId("folders").replaceChildren(...result.folders.map(folder => {
    const button = element("button", folder.name);
    button.type = "button";
    button.onclick = () => browseSafely(folder.path);
    return button;
  }));
}
async function browseSafely(path) {
  byId("importError").textContent = "";
  try { await browse(path); }
  catch (error) { byId("importError").textContent = error.message; }
}
function openImport(batch, rescore = false, refine = false) {
  resumeBatch = batch;
  rescoreBatch = rescore;
  refineBatch = refine;
  byId("importTitle").textContent = refine ? "hy4 优化分组" : rescore ? "按新分组重评" : batch ? "续跑当前批次" : "新建批次";
  byId("start").textContent = refine ? "发送候选缩略图并复核" : rescore ? "开始重评" : batch ? "继续处理" : "开始去重、分组和评分";
  byId("folderPicker").hidden = !!batch;
  byId("importError").textContent = "";
  byId("importDialog").showModal();
  if (!batch && !byId("folderPath").value) browseSafely("");
}
byId("newBatch").onclick = () => openImport(null);
byId("resume").onclick = () => openImport(activeBatch);
byId("rescore").onclick = () => openImport(activeBatch, true);
byId("refineGroups").onclick = () => openImport(activeBatch, false, true);
byId("browse").onclick = () => browseSafely(byId("folderPath").value.trim());
byId("up").onclick = () => browseSafely(folderParent);
byId("cancelImport").onclick = () => byId("importDialog").close();
byId("batch").onchange = async () => {
  try { await switchBatch(byId("batch").value); }
  catch (error) {
    byId("batch").value = activeBatch;
    status("无法保存当前审核：" + error.message);
  }
};
byId("importForm").onsubmit = async event => {
  event.preventDefault();
  const button = byId("start");
  button.disabled = true;
  try {
    if (dirty && activeBatch) {
      await post("/api/review", {choices:changed});
      dirty = false;
    }
    const result = await post("/api/batches", {
      source: byId("folderPath").value.trim(), batch: resumeBatch, key: byId("apiKey").value,
      rescore: rescoreBatch, refine_groups: refineBatch
    });
    byId("apiKey").value = "";
    await loadBatches();
    await switchBatch(result.batch);
    byId("importDialog").close();
  } catch (error) { byId("importError").textContent = error.message; }
  finally { button.disabled = false; }
};
async function initialize() {
  try {
    const batches = await loadBatches();
    const previous = localStorage.getItem("photo-review-batch");
    const id = batches.find(batch => batch.id === previous)?.id || batches[0]?.id;
    if (id) await switchBatch(id);
    else byId("counts").textContent = "请选择照片文件夹";
  } catch (error) { status(error.message); }
}
async function act(button, operation) {
  if (!project) return;
  button.disabled = true;
  try { await operation(); }
  catch (error) { status(error.message); }
  finally { button.disabled = false; }
}
byId("filter").onchange = () => { if (project) render(); };
byId("rankLimit").onchange = () => { if (project) render(); };
byId("groupBy").onchange = () => { if (project) render(); };
byId("refresh").onclick = () => refresh();
function layoutViewer() {
  if (!viewerPhoto || !byId("viewer").open) return;
  const stage = byId("viewerStage");
  const width = viewerPhoto.width || byId("viewerImage").naturalWidth || 1;
  const height = viewerPhoto.height || byId("viewerImage").naturalHeight || 1;
  const fit = Math.min(stage.clientWidth / width, stage.clientHeight / height);
  byId("viewerImage").style.width = width * fit * zoom + "px";
  byId("viewerImage").style.height = height * fit * zoom + "px";
  stage.toggleAttribute("data-zoomed", zoom > 1);
  byId("zoomReset").textContent = zoom === 1 ? "适屏" : Math.round(zoom * 100) + "%（相对适屏）";
}
new ResizeObserver(layoutViewer).observe(byId("viewerStage"));
async function loadViewerImage(force = false) {
  const view = viewerView;
  const source = "/preview/" + viewerPhoto.id + ".jpg";
  const query = new URLSearchParams({view, batch:viewerBatch || "legacy"});
  if (zoom > 1) query.set("full", "1");
  const url = view === "original" && zoom === 1 ? source : source + "?" + query;
  if (!force && imageUrl === url) return;
  const request = ++viewerRequest;
  imageUrl = url;
  byId("viewerStatus").textContent = "正在加载…";
  try {
    const response = await fetch(url);
    if (!response.ok) {
      const message = response.headers.get("Content-Type")?.includes("application/json") ?
        (await response.json()).error : "读取照片失败";
      throw Error(message);
    }
    const blob = await response.blob();
    if (request !== viewerRequest || !byId("viewer").open) return;
    const image = byId("viewerImage");
    if (image.src.startsWith("blob:")) URL.revokeObjectURL(image.src);
    image.src = URL.createObjectURL(blob);
    byId("viewerStatus").textContent = view === "masks" ? "橙色为人脸，蓝色为天空。" : "";
  } catch (error) {
    if (request !== viewerRequest) return;
    imageUrl = "";
    byId("viewerStatus").textContent = error.message;
  }
}
function changeZoom(value, x, y) {
  const stage = byId("viewerStage");
  const image = byId("viewerImage");
  const old = image.getBoundingClientRect();
  const bounds = stage.getBoundingClientRect();
  x ??= bounds.left + stage.clientWidth / 2;
  y ??= bounds.top + stage.clientHeight / 2;
  const relativeX = Math.max(0, Math.min(1, (x - old.left) / (old.width || 1)));
  const relativeY = Math.max(0, Math.min(1, (y - old.top) / (old.height || 1)));
  zoom = Math.max(1, Math.min(12, value));
  layoutViewer();
  const next = image.getBoundingClientRect();
  stage.scrollLeft += next.left + relativeX * next.width - x;
  stage.scrollTop += next.top + relativeY * next.height - y;
  if (zoom === 1) stage.scrollTo(0, 0);
  loadViewerImage();
}
const viewerStage = byId("viewerStage");
function openViewerPhoto(photo) {
  viewerRequest++;
  viewerPhoto = photo;
  const image = byId("viewerImage");
  if (image.src.startsWith("blob:")) URL.revokeObjectURL(image.src);
  image.src = "/preview/" + photo.id + ".jpg";
  image.alt = photo.name;
  imageUrl = "";
  zoom = 1;
  const index = viewerGroup.findIndex(item => item.id === photo.id);
  byId("viewerName").textContent = photo.name;
  byId("viewerPosition").textContent = (index + 1) + " / " + viewerGroup.length;
  byId("prevPhoto").disabled = index <= 0;
  byId("nextPhoto").disabled = index >= viewerGroup.length - 1;
  byId("viewerStatus").textContent = "";
  byId("gradeKeyForm").hidden = true;
  byId("gradeKey").value = "";
  layoutViewer();
  viewerStage.scrollTo(0, 0);
  setViewerView("original");
  updateAdviceButton();
}
function moveViewerPhoto(step) {
  const index = viewerGroup.findIndex(item => item.id === viewerPhoto.id);
  const next = viewerGroup[index + step];
  if (next) openViewerPhoto(next);
}
function setViewerView(view) {
  viewerView = view;
  if (view !== "masks") compareView = view;
  byId("compareGrade").textContent = compareView === "original" ? "看调色版 (C)" : "看原图 (C)";
  byId("showMasks").setAttribute("aria-pressed", view === "masks");
  loadViewerImage();
}
function toggleCompare() {
  setViewerView(compareView === "original" ? "adjusted" : "original");
}
byId("prevPhoto").onclick = () => moveViewerPhoto(-1);
byId("nextPhoto").onclick = () => moveViewerPhoto(1);
byId("compareGrade").onclick = toggleCompare;
byId("showMasks").onclick = () => setViewerView(viewerView === "masks" ? compareView : "masks");
viewerStage.addEventListener("wheel", event => {
  if (!event.deltaY) return;
  event.preventDefault();
  changeZoom(zoom * (event.deltaY < 0 ? 1.2 : 1 / 1.2), event.clientX, event.clientY);
}, {passive:false});
viewerStage.onpointerdown = event => {
  if (event.button !== 0 || event.target !== byId("viewerImage")) return;
  if (zoom === 1) {
    changeZoom(2, event.clientX, event.clientY);
    return;
  }
  drag = {id:event.pointerId, x:event.clientX, y:event.clientY,
          left:viewerStage.scrollLeft, top:viewerStage.scrollTop};
  viewerStage.setPointerCapture(event.pointerId);
  viewerStage.toggleAttribute("data-dragging", true);
};
viewerStage.onpointermove = event => {
  if (drag?.id !== event.pointerId) return;
  viewerStage.scrollLeft = drag.left + drag.x - event.clientX;
  viewerStage.scrollTop = drag.top + drag.y - event.clientY;
};
viewerStage.onlostpointercapture = () => {
  drag = null;
  viewerStage.removeAttribute("data-dragging");
};
byId("viewer").addEventListener("keydown", event => {
  if (event.target.matches("input,select,textarea") || event.ctrlKey || event.altKey || event.metaKey) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    moveViewerPhoto(event.key === "ArrowLeft" ? -1 : 1);
    return;
  }
  if (event.key.toLowerCase() === "c") {
    event.preventDefault();
    if (!event.repeat) toggleCompare();
    return;
  }
  if (!["+", "=", "-", "−", "0"].includes(event.key)) return;
  event.preventDefault();
  changeZoom(event.key === "0" ? 1 : zoom * (["+", "="].includes(event.key) ? 1.25 : 0.8));
});
window.addEventListener("resize", layoutViewer);
byId("zoomIn").onclick = () => changeZoom(zoom * 1.25);
byId("zoomOut").onclick = () => changeZoom(zoom * 0.8);
byId("zoomReset").onclick = () => changeZoom(1);
byId("viewer").addEventListener("close", () => {
  viewerRequest++;
  const image = byId("viewerImage");
  if (image.src.startsWith("blob:")) URL.revokeObjectURL(image.src);
  image.removeAttribute("src");
  byId("gradeKey").value = "";
});
function updateAdviceButton() {
  const enabled = project.grade_advice?.includes(viewerPhoto.id);
  byId("gradeAdvice").textContent = enabled ? "恢复本地调色" : "使用 hy4 建议";
}
async function changeAdvice(reset) {
  const photo = viewerPhoto.id;
  const batch = viewerBatch;
  const key = byId("gradeKey").value;
  byId("gradeKey").value = "";
  const button = byId("gradeAdvice");
  const submit = byId("gradeKeyForm").querySelector("button");
  button.disabled = submit.disabled = true;
  byId("viewerStatus").textContent = reset ? "正在恢复本地调色…" : "正在获取 hy4 建议…";
  try {
    await post("/api/grade-advice", {photo, key, reset}, batch);
    if (batch === activeBatch) {
      project.grade_advice = (project.grade_advice || []).filter(id => id !== photo);
      if (!reset) project.grade_advice.push(photo);
    }
    if (!byId("viewer").open || photo !== viewerPhoto.id || batch !== viewerBatch) return;
    byId("gradeKeyForm").hidden = true;
    updateAdviceButton();
    setViewerView("adjusted");
    loadViewerImage(true);
  } catch (error) {
    if (byId("viewer").open && photo === viewerPhoto.id && batch === viewerBatch)
      byId("viewerStatus").textContent = error.message;
  } finally {
    button.disabled = submit.disabled = false;
  }
}
byId("gradeAdvice").onclick = () => {
  if (project.grade_advice?.includes(viewerPhoto.id)) changeAdvice(true);
  else {
    const form = byId("gradeKeyForm");
    form.hidden = !form.hidden;
    if (!form.hidden) byId("gradeKey").focus();
  }
};
byId("gradeKeyForm").onsubmit = event => {
  event.preventDefault();
  changeAdvice(false);
};
byId("close").onclick = () => byId("viewer").close();
byId("save").onclick = () => act(byId("save"), async () => {
  const id = activeBatch;
  const savedChoices = {...changed};
  await post("/api/review", {choices:savedChoices}, id);
  if (id !== activeBatch) return;
  for (const [key, value] of Object.entries(savedChoices)) {
    if (changed[key] === value) delete changed[key];
  }
  dirty = Object.keys(changed).length > 0;
  status("已保存审核。");
});
for (const [id, mode] of [["original","original"],["adjusted","adjusted"]]) {
  byId(id).onclick = () => act(byId(id), async () => {
    status("正在导出…");
    const choices = Object.fromEntries(allPhotos().map(photo => [photo.id, photo.selected]));
    const result = await post("/api/export", {choices, mode});
    status("已导出 " + result.count + " 张\n" + result.folder +
           (result.failures.length ? "\n" + result.failures.join("\n") : ""));
  });
}
window.addEventListener("beforeunload", event => { if (dirty) event.preventDefault(); });
initialize();
</script>
